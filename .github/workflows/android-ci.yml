# Checks the Android app: the version-code tests, Android lint, the JVM unit tests (which include
# the contract tests against the real Go server) and a debug build. Runs on pull requests that touch
# the app, and is called by android-release.yml before anything is signed.
name: android-ci

on:
  pull_request:
    paths:
      - android/**
      - web/app/globals.css
      - web/app/icon.svg
      - scripts/*android*
      - .github/workflows/android-*.yml
  workflow_call:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      # The contract tests build and run the real server; with CI set they fail instead of skipping if Go is missing.
      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
      - name: Version code tests
        run: bash scripts/test-android-version.sh
      - name: Lint, unit and contract tests, debug build
        working-directory: android
        run: ./gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: android-reports
          path: |
            android/app/build/reports
            android/app/build/test-results
          retention-days: 7

  # The device tests and the UI flows on an emulator, against a real server (scripts/android-ui-test.sh).
  ui:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash scripts/android-ui-test.sh
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: android-ui-reports
          path: android/app/build/reports
          retention-days: 7
